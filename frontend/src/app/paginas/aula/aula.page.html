<ion-header [translucent]="true">
  <ion-toolbar color="dark">
    <ion-title>{{ titulo }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen class="aula-contenido">
  <div class="aula-wrapper">
    <ion-card>
      <ion-card-header>
        <ion-card-title class="ion-text-center">Datos del aula</ion-card-title>
      </ion-card-header>

      <ion-card-content>
        <form [formGroup]="aulaForm" (ngSubmit)="guardarAula()">
          <ion-label><b>Nombre del aula:</b></ion-label>
          <ion-item lines="none" [class.invalid]="esInvalido('nombre')">
            <ion-input
              formControlName="nombre"
              placeholder="Ej: Matemáticas 2do B"
            ></ion-input>
          </ion-item>
          <ion-text color="danger" *ngIf="esInvalido('nombre')">
            {{ mensajeError('nombre') }}
          </ion-text>

          <ion-button expand="block" shape="round" type="submit">
            Guardar
          </ion-button>

          <ion-button expand="block" color="medium" shape="round" type="button" (click)="cancelar()">
            Cancelar
          </ion-button>
        </form>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
