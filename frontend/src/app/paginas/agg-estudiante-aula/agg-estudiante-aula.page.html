<ion-header [translucent]="true">
  <ion-toolbar color="dark">
    <ion-title>Agregar estudiante al aula</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen class="agregar-estudiante-contenido">
  <div class="agregar-estudiante-wrapper">
    <ion-card>
      <ion-card-header>
        <ion-card-title class="ion-text-center">Buscar estudiante</ion-card-title>
      </ion-card-header>

      <ion-card-content>
        <form [formGroup]="buscarForm" (ngSubmit)="buscarEstudiantes()">
          <ion-label><b>Nombre o apellido:</b></ion-label>
          <ion-item lines="none" [class.invalid]="esInvalido('q')">
            <ion-input
              formControlName="q"
              placeholder="Ej: Ana, Pérez"
            ></ion-input>
          </ion-item>
          <ion-text color="danger" *ngIf="esInvalido('q')">
            {{ mensajeError('q') }}
          </ion-text>

          <ion-button expand="block" shape="round" type="submit">
            <ion-icon name="search-outline" slot="start"></ion-icon>
            Buscar
          </ion-button>

          <ion-button expand="block" color="medium" shape="round" type="button" (click)="cancelar()">
            Cancelar
          </ion-button>
        </form>

        <ion-text color="medium" *ngIf="buscando">
          <p>Buscando estudiantes...</p>
        </ion-text>

        <ion-list *ngIf="!buscando && resultados.length > 0">
          <ion-item *ngFor="let e of resultados">
            <ion-label>
              <h2>{{ nombreCompleto(e) }}</h2>
              <p>{{ e.email }}</p>
              <p *ngIf="e.grado_grupo">Grado/Grupo: {{ e.grado_grupo }}</p>
            </ion-label>
            <ion-button
              size="small"
              shape="round"
              (click)="agregarEstudiante(e)"
            >
              <ion-icon name="person-add-outline" slot="start"></ion-icon>
              Agregar
            </ion-button>
          </ion-item>
        </ion-list>

        <ion-text color="medium" *ngIf="!buscando && resultados.length === 0 && buscarForm.valid">
          <p>No se encontraron estudiantes con ese criterio.</p>
        </ion-text>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
